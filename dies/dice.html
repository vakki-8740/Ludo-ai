<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo Dice</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #e6e7e8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    gap: 24px;
    padding: 24px;
  }
  .dice {
    width: 110px;
    height: 110px;
    background: #fff;
    border: 3px solid #111;
    border-radius: 14px;
    box-sizing: border-box;
    padding: 14px;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    place-items: center;
  }
  .pip {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #000;
  }
  .pip.red { background: #ee1c25; }

  /* positions: r = row, c = column (1-3) */
  .r1 { grid-row: 1; } .r2 { grid-row: 2; } .r3 { grid-row: 3; }
  .c1 { grid-column: 1; } .c2 { grid-column: 2; } .c3 { grid-column: 3; }

  @media (max-width: 420px) {
    .board { grid-template-columns: repeat(3, 90px); gap: 14px; padding: 12px; }
    .dice { width: 90px; height: 90px; padding: 11px; }
    .pip { width: 16px; height: 16px; }
  }
</style>
</head>
<body>
  <div class="board">

    <!-- 1 -->
    <div class="dice">
      <span class="pip red r2 c2"></span>
    </div>

    <!-- 2 -->
    <div class="dice">
      <span class="pip r1 c1"></span>
      <span class="pip r3 c3"></span>
    </div>

    <!-- 3 -->
    <div class="dice">
      <span class="pip r1 c1"></span>
      <span class="pip r2 c2"></span>
      <span class="pip r3 c3"></span>
    </div>

    <!-- 4 -->
    <div class="dice">
      <span class="pip r1 c1"></span>
      <span class="pip r1 c3"></span>
      <span class="pip r3 c1"></span>
      <span class="pip r3 c3"></span>
    </div>

    <!-- 5 -->
    <div class="dice">
      <span class="pip r1 c1"></span>
      <span class="pip r1 c3"></span>
      <span class="pip r2 c2"></span>
      <span class="pip r3 c1"></span>
      <span class="pip r3 c3"></span>
    </div>

    <!-- 6 -->
    <div class="dice">
      <span class="pip r1 c1"></span>
      <span class="pip r1 c3"></span>
      <span class="pip r2 c1"></span>
      <span class="pip r2 c3"></span>
      <span class="pip r3 c1"></span>
      <span class="pip r3 c3"></span>
    </div>

  </div>
</body>
</html>
